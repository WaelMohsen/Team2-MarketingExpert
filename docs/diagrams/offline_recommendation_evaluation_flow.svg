<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1180" viewBox="0 0 980 1180" role="img" aria-labelledby="title desc">
  <title id="title">Offline Recommendation Evaluation Flow</title>
  <desc id="desc">Static architecture flow for the benchmark-driven recommendation evaluation pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355070" />
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #355070; stroke-width: 2; rx: 16; }
      .success { fill: #ecfeff; stroke: #0f766e; stroke-width: 2; rx: 16; }
      .small { font-size: 14px; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="490" y="54" text-anchor="middle" class="title">Offline Recommendation Evaluation Flow</text>
  <text x="490" y="82" text-anchor="middle" class="subtitle">Static companion to the benchmark Mermaid diagram used in the README.</text>

  <rect x="220" y="130" width="540" height="90" class="box" />
  <text x="490" y="168" text-anchor="middle" class="small">Developer or CI selects one or more saved reports</text>
  <text x="490" y="192" text-anchor="middle" class="small">or uses a built-in sample candidate</text>

  <path d="M 490 220 L 490 260" class="arrow" />

  <rect x="220" y="260" width="540" height="100" class="box" />
  <text x="490" y="302" text-anchor="middle" class="small">RecommendationBenchmarkRepository loads benchmark</text>
  <text x="490" y="326" text-anchor="middle" class="small">cases from data/benchmarks/recommendation_cases.json</text>

  <path d="M 490 360 L 490 400" class="arrow" />

  <rect x="220" y="400" width="540" height="100" class="box" />
  <text x="490" y="442" text-anchor="middle" class="small">Build RecommendationBenchmarkCandidate objects</text>
  <text x="490" y="466" text-anchor="middle" class="small">from saved output logs or sample reports</text>

  <path d="M 490 500 L 490 540" class="arrow" />

  <rect x="220" y="540" width="540" height="100" class="box" />
  <text x="490" y="582" text-anchor="middle" class="small">RecommendationBenchmarkRunner matches candidates</text>
  <text x="490" y="606" text-anchor="middle" class="small">to the selected benchmark cases</text>

  <path d="M 490 640 L 490 680" class="arrow" />

  <rect x="220" y="680" width="540" height="110" class="box" />
  <text x="490" y="720" text-anchor="middle" class="small">RecommendationEvaluationFramework scores</text>
  <text x="490" y="744" text-anchor="middle" class="small">problem relevance, grounding, actionability,</text>
  <text x="490" y="768" text-anchor="middle" class="small">impact, feasibility, measurability, clarity, and duplication</text>

  <path d="M 490 790 L 490 830" class="arrow" />

  <rect x="220" y="830" width="540" height="100" class="box" />
  <text x="490" y="872" text-anchor="middle" class="small">The runner ranks candidate outputs and can summarize</text>
  <text x="490" y="896" text-anchor="middle" class="small">temperature or parameter sensitivity across runs</text>

  <path d="M 490 930 L 490 970" class="arrow" />

  <rect x="220" y="970" width="540" height="90" class="box" />
  <text x="490" y="1008" text-anchor="middle" class="small">RecommendationBenchmarkCaseResult or SuiteResult</text>
  <text x="490" y="1032" text-anchor="middle" class="small">is serialized as JSON for review or CI artifacts</text>

  <path d="M 490 1060 L 490 1100" class="arrow" />

  <rect x="220" y="1100" width="540" height="60" class="success" />
  <text x="490" y="1137" text-anchor="middle" class="small">Teams compare outputs consistently across prompts, models, and temperatures</text>
</svg>
